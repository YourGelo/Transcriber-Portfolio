name: transcriber-portfolio
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-audio}
  WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: ["audio-data:/data"]
  bucket:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment: *app-env
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; then
            mc mb --ignore-existing "local/$$S3_BUCKET"
            exit 0
          fi
          sleep 2
        done
        exit 1
  migrate:
    build: {context: ., target: api}
    environment: *app-env
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., target: api}
    environment: *app-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      bucket: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: {context: ., target: worker}
    environment: *app-env
    volumes: ["models:/home/app/.cache"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      bucket: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  db-data:
  redis-data:
  audio-data:
  models:
